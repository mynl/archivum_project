version: 1
disable_existing_loggers: false

formatters:
  json:
    class: pythonjsonlogger.jsonlogger.JsonFormatter
    format: "%(asctime)s %(levelname)s %(name)s %(message)s"
    rename_fields:
      levelname: level
      asctime: time

  json_detailed:
    class: pythonjsonlogger.jsonlogger.JsonFormatter
    format: "%(asctime)s %(levelname)s %(name)s %(message)s %(filename)s %(funcName)s %(lineno)d %(process)d %(threadName)s"
    rename_fields:
      asctime: time
      levelname: level

  plain:
    class: logging.Formatter
    format: "%(asctime)s %(levelname)-8s %(name)s: %(message)s"
    datefmt: "%H:%M:%S"

handlers:
  console_debug:
    class: logging.StreamHandler
    level: WARNING
    formatter: plain
    stream: ext://sys.stderr

  console_info:
    class: logging.StreamHandler
    level: INFO
    formatter: plain
    stream: ext://sys.stderr

  console_warning:
    class: logging.StreamHandler
    level: WARNING
    formatter: plain
    stream: ext://sys.stderr

  file_summary:
    # rotate based on size
    class: logging.handlers.RotatingFileHandler
    maxBytes: 10485760
    backupCount: 3
    filename: /tmp/archivum-summary.json
    level: INFO
    formatter: json
    encoding: utf8

  file_detail:
    # rotate daily
    class: logging.handlers.TimedRotatingFileHandler
    when: midnight
    interval: 1
    backupCount: 7
    filename: /tmp/archivum-detail.json
    level: DEBUG
    formatter: json_detailed
    encoding: utf8

loggers:
  aggregate:
    level: INFO
    handlers: [console_warning, file_summary]
    propagate: false

  greater_tables:
    level: INFO
    handlers: [console_warning, file_detail, file_summary]
    propagate: false

  archivum:
    level: DEBUG
    handlers: [console_info, file_detail, file_summary]
    propagate: false

root:
  level: WARNING
  handlers: [console_warning]
