base_cols:
  - tag
  - author
  - title
  - journal
  - create
  - added
  - hash
  - year
  - type

date_fields:
  - added
  - create
  - mod
  - access 

default_date_field: mod

bang_field: author
# Recent means recently added references (ref.feather), not recently
# acquired documents: replacing a document does not move its reference.
recent_field: added

fuzzy:
  fields:
    - author
    - title
  limit: 50
  score_col_name: score
