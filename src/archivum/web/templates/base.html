<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivum | {{ lib.name if lib else 'No Library' }}</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='icon/favicon.ico') }}">

    <!-- stand alone app -->
    <!-- custom-header.html -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="archivum">
    <link rel="icon" href="/static/icon/android-chrome-192x192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="/static/icon/apple-touch-icon.png">
    <link rel="manifest" href="/static/manifest.json">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <style>
        .search-wrapper { position: relative; }
        .clear-input {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #ccc;
            z-index: 10;
        }
        .clear-input:hover { color: #666; }
    </style>
</head>
<body class="bg-light">
    <header class="bg-white border-bottom sticky-top shadow-sm py-0">
        <nav class="navbar navbar-expand-lg navbar-light py-0">
            <div class="container-fluid px-4">
                <!-- Branding Group -->
                <div class="d-flex align-items-center py-1">
                    <img src="{{ url_for('static', filename='icon/android-chrome-192x192.png') }}" 
                         alt="Archivum Logo" 
                         style="height: 45px; width: auto; margin-right: -10px;">

                    <div class="d-flex flex-column align-items-center text-center px-4" style="min-width: 120px;">
                        <div class="fw-bold text-dark" style="line-height: 1; font-size: 1.1rem;">{{ lib.name if lib else 'No Library' }}</div>
                        <div class="text-muted" style="font-size: 0.55rem; font-family: monospace; letter-spacing: 0.3em; margin-top: 1px;">archivum</div>
                    </div>

                    <div class="d-none d-md-block" style="border-left: 1px solid #eee; height: 25px; margin: 0 0.5rem;"></div>
                </div>

                <!-- Hamburger Toggle -->
                <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Collapsible Menu -->
                <div class="collapse navbar-collapse" id="mainNavbar">
                    <ul class="navbar-nav nav-pills bg-light bg-lg-transparent p-1 rounded-3 ms-lg-2 my-2 my-lg-0">
                        <li class="nav-item">
                            <a href="{{ url_for('main.index') }}" 
                               class="nav-link py-1 px-3 {{ 'active shadow-sm' if request.endpoint == 'main.index' else 'text-dark fw-medium' }}">Query</a>
                        </li>
                        <li class="nav-item">
                            <a href="{{ url_for('main.ingest_page') }}" 
                               class="nav-link py-1 px-3 {{ 'active shadow-sm' if request.endpoint == 'main.ingest_page' else 'text-dark fw-medium' }}">Ingest</a>
                        </li>
                        <li class="nav-item">
                            <a href="{{ url_for('main.ripgrep_page') }}" 
                               class="nav-link py-1 px-3 {{ 'active shadow-sm' if request.endpoint == 'main.ripgrep_page' else 'text-dark fw-medium' }}">Ripgrep</a>
                        </li>
                        <li class="nav-item">
                            <a href="{{ url_for('main.editor_page') }}" 
                               class="nav-link py-1 px-3 {{ 'active shadow-sm' if request.endpoint == 'main.editor_page' else 'text-dark fw-medium' }}">Edit</a>
                        </li>
                        <li class="nav-item">
                            <a href="{{ url_for('main.insights_page') }}" 
                               class="nav-link py-1 px-3 {{ 'active shadow-sm' if request.endpoint == 'main.insights_page' else 'text-dark fw-medium' }}">Insights</a>
                        </li>
                        <li class="nav-item">
                            <a href="{{ url_for('main.status') }}" 
                               class="nav-link py-1 px-3 {{ 'active shadow-sm' if request.endpoint == 'main.status' else 'text-dark fw-medium' }}">Status</a>
                        </li>
                        <li class="nav-item">
                            <a href="{{ url_for('main.history') }}" 
                               class="nav-link py-1 px-3 {{ 'active shadow-sm' if request.endpoint == 'main.history' else 'text-dark fw-medium' }}">History</a>
                        </li>
                    </ul>

                    <!-- Sync Status (Right Aligned) -->
                    <div class="ms-auto d-flex align-items-center">
                        <div id="sync-indicator" 
                             class="indicator" 
                             title="Library Sync Status"
                             hx-get="{{ url_for('main.sync_check') }}" 
                             hx-trigger="every 10s"
                             hx-swap="none"></div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container-fluid px-4 py-4" style="max-width: 1600px;">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // --- Search History & Input Utilities ---
        const searchHistories = {};

        function initSearchInput(inputId) {
            const input = document.getElementById(inputId);
            if (!input) return;
            
            const storageKey = 'history_' + inputId;
            searchHistories[inputId] = JSON.parse(localStorage.getItem(storageKey) || '[]');
            let historyIndex = -1;

            input.addEventListener('keydown', function(e) {
                const history = searchHistories[inputId];
                
                if (e.key === 'Enter') {
                    const val = input.value.trim();
                    if (val && history[0] !== val) {
                        history.unshift(val);
                        if (history.length > 50) history.pop();
                        localStorage.setItem(storageKey, JSON.stringify(history));
                    }
                    historyIndex = -1;
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (historyIndex < history.length - 1) {
                        historyIndex++;
                        input.value = history[historyIndex];
                    }
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if (historyIndex > 0) {
                        historyIndex--;
                        input.value = history[historyIndex];
                    } else if (historyIndex === 0) {
                        historyIndex = -1;
                        input.value = '';
                    }
                }
            });
        }

        function clearInput(inputId) {
            const input = document.getElementById(inputId);
            if (input) {
                input.value = '';
                input.focus();
                if (inputId === 'search-input') htmx.trigger(input, 'keyup');
            }
        }

        window.addEventListener('load', () => {
            initSearchInput('search-input');
            initSearchInput('rg-input');
        });

        document.body.addEventListener('htmx:afterRequest', function(evt) {
            if (evt.detail.pathInfo.requestPath.includes('sync-check')) {
                const indicator = document.getElementById('sync-indicator');
                if (evt.detail.xhr.responseText === 'reload-needed') {
                    indicator.classList.add('needs-reload');
                } else {
                    indicator.classList.remove('needs-reload');
                }
            }
        });
    </script>
</body>
</html>
