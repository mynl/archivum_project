<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivum | {{ lib.name if lib else 'No Library' }}</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='icon/favicon.ico') }}">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="bg-light">
    <header class="bg-white border-bottom sticky-top shadow-sm py-2">
        <div class="container-fluid px-4">
            <div class="d-flex align-items-center justify-content-between">
                <!-- Branding & Menu Group -->
                <div class="d-flex align-items-center">
                    <!-- Logo -->
                    <img src="{{ url_for('static', filename='icon/android-chrome-192x192.png') }}" 
                         alt="Archivum Logo" 
                         style="height: 80px; width: auto;">

                    <!-- Brand Stack -->
                    <div class="d-flex flex-column align-items-center text-center px-4">
                        <div class="h4 mb-0 fw-bold text-dark">{{ lib.name if lib else 'No Library' }}</div>
                        <div class="text-muted small font-monospace" style="letter-spacing: 0.2em; margin-top: -2px;">archivum</div>
                    </div>

                    <!-- Vertical Separator -->
                    <div class="d-none d-md-block" style="border-left: 1px solid #ccc; height: 50px; margin: 0 1rem;"></div>

                    <!-- Menu - Left Aligned to the right of | -->
                    <nav class="nav nav-pills bg-light p-1 rounded-3 ms-2">
                        <a href="{{ url_for('main.index') }}" 
                           class="nav-link py-2 px-3 {{ 'active shadow-sm' if request.endpoint == 'main.index' else 'text-dark fw-medium' }}">Query</a>
                        <a href="{{ url_for('main.ripgrep_page') }}" 
                           class="nav-link py-2 px-3 {{ 'active shadow-sm' if request.endpoint == 'main.ripgrep_page' else 'text-dark fw-medium' }}">Ripgrep</a>
                        <a href="{{ url_for('main.editor_page') }}" 
                           class="nav-link py-2 px-3 {{ 'active shadow-sm' if request.endpoint == 'main.editor_page' else 'text-dark fw-medium' }}">Edit</a>
                        <a href="{{ url_for('main.status') }}" 
                           class="nav-link py-2 px-3 {{ 'active shadow-sm' if request.endpoint == 'main.status' else 'text-dark fw-medium' }}">Status</a>
                        <a href="{{ url_for('main.history') }}" 
                           class="nav-link py-2 px-3 {{ 'active shadow-sm' if request.endpoint == 'main.history' else 'text-dark fw-medium' }}">History</a>
                    </nav>
                </div>

                <!-- Sync Status -->
                <div class="col-auto d-none d-lg-block">
                    <div id="sync-indicator" 
                         class="indicator" 
                         title="Library Sync Status"
                         hx-get="{{ url_for('main.sync_check') }}" 
                         hx-trigger="every 10s"
                         hx-swap="none"></div>
                </div>
            </div>
        </div>
    </header>

    <main class="container-fluid px-4 py-4" style="max-width: 1400px;">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.body.addEventListener('htmx:afterRequest', function(evt) {
            if (evt.detail.pathInfo.requestPath.includes('sync-check')) {
                const indicator = document.getElementById('sync-indicator');
                if (evt.detail.xhr.responseText === 'reload-needed') {
                    indicator.classList.add('needs-reload');
                } else {
                    indicator.classList.remove('needs-reload');
                }
            }
        });
    </script>
</body>
</html>
