<div class="card shadow-sm border-0 mt-3">
    <div class="card-header bg-white border-bottom d-flex justify-content-between align-items-center py-2 px-3">
        <span class="text-muted small fw-bold text-uppercase">Reference</span>
        <div class="d-flex gap-2">
            <button type="button" class="btn btn-sm btn-outline-secondary"
                    hx-get="{{ url_for('main.edit_merge', keep=tag) }}" hx-target="#edit-actions-panel">
                <i class="bi bi-intersect me-1"></i> Merge another reference into {{ tag }}&hellip;
            </button>
            <button type="button" class="btn btn-sm btn-outline-danger"
                    hx-get="{{ url_for('main.edit_delete', tag=tag) }}" hx-target="#edit-actions-panel">
                <i class="bi bi-trash me-1"></i> Delete {{ tag }}&hellip;
            </button>
        </div>
    </div>
    <div id="edit-actions-panel"></div>
</div>
