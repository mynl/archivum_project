<div class="card shadow-sm border-0">
    <div class="card-header bg-white border-bottom-0 py-3">
        <h4 class="mb-0 fw-bold">Edit Reference: <span class="text-primary">{{ tag }}</span></h4>
        {% if added %}<div class="small text-muted mt-1" title="When the reference entered the library. Set automatically; not editable.">Added {{ added }}</div>{% endif %}
    </div>
    <div class="card-body">
        <form hx-post="{{ url_for('main.edit_tag', tag=tag) }}" hx-target="#editor-container">
            <div class="mb-4">
                <label for="bibtex" class="form-label fw-bold small text-muted text-uppercase">BibTeX Entry</label>
                <textarea class="form-control font-monospace p-3 border-2" 
                          id="bibtex"
                          name="bibtex"
                          data-tag="{{ tag }}"
                          rows="18" 
                          style="font-size: 0.85rem; line-height: 1.5; background-color: #fcfcfc;">{{ bib_str }}</textarea>
                <div class="form-text mt-2">
                    <i class="bi bi-info-circle me-1"></i> You can change the <b>tag</b> or other fields. Tag uniqueness is verified on save.
                </div>
            </div>
            
            <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                <div id="edit-error" class="text-danger small fw-bold"></div>
                <div class="d-flex gap-2">
                    <button type="button" 
                            class="btn btn-light px-4 fw-medium border"
                            onclick="cancelEdit()">Cancel</button>
                    <button type="submit" class="btn btn-primary px-5 fw-bold">Save Changes</button>
                </div>
            </div>
        </form>
    </div>
</div>
{{ documents_html|safe }}
