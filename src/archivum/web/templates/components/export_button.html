<!-- Reusable Export Split Button -->
<div class="btn-group shadow-sm">
    <button id="{{ id_prefix }}-export-btn" 
            onclick="handleExportToQuery('{{ id_prefix }}', '{{ input_id }}')"
            class="btn btn-outline-info px-4 opacity-50" 
            disabled
            title="Export documents to Query screen">
        Export
    </button>
    <button id="{{ id_prefix }}-export-toggle"
            type="button" 
            class="btn btn-outline-info dropdown-toggle dropdown-toggle-split opacity-50" 
            data-bs-toggle="dropdown" 
            aria-expanded="false" 
            disabled>
        <span class="visually-hidden">Toggle Dropdown</span>
    </button>
    <ul class="dropdown-menu">
        <li><a class="dropdown-item" href="#" onclick="handleExportToQuery('{{ id_prefix }}', '{{ input_id }}')">To Query (Max 500)</a></li>
        <li><a class="dropdown-item" href="#" onclick="handleExportToCSV('{{ id_prefix }}', '{{ input_id }}')">To CSV (All matches)</a></li>
    </ul>
</div>

<script>
    if (typeof handleExportToQuery !== 'function') {
        window.handleExportToQuery = function(idPrefix, inputId) {
            const btn = document.getElementById(`${idPrefix}-export-btn`);
            const hashes = btn.dataset.hashes;
            if (!hashes) return;
            
            const query = `q top 500 hash ~ /${hashes}/`;
            window.location.href = `{{ url_for('main.index') }}?q=${encodeURIComponent(query)}`;
        };
    }

    if (typeof handleExportToCSV !== 'function') {
        window.handleExportToCSV = function(idPrefix, inputId) {
            const btn = document.getElementById(`${idPrefix}-export-btn`);
            const hashes = btn.dataset.hashes;
            if (!hashes) return;

            const input = document.getElementById(inputId);
            const query = input ? input.value : '';
            const url = `{{ url_for('main.rg_export_csv') }}?q=${encodeURIComponent(query)}`;
            window.location.href = url;
        };
    }
</script>
