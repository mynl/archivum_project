<div id="{{ id_prefix }}-export-container" class="btn-group shadow-sm" hx-swap-oob="true">
    <button id="{{ id_prefix }}-export-btn"
            onclick="handleExportToQuery('{{ id_prefix }}', '{{ input_id }}')"
            class="btn btn-secondary px-4 fw-bold"
            data-hashes="{{ hashes }}"
            title="Export documents to Query screen">
        Export
    </button>
    <button id="{{ id_prefix }}-export-toggle"
            type="button"
            class="btn btn-secondary dropdown-toggle dropdown-toggle-split"
            data-bs-toggle="dropdown"
            aria-expanded="false">
        <span class="visually-hidden">Toggle Dropdown</span>
    </button>
    <ul class="dropdown-menu dropdown-menu-end shadow">
        <li><a class="dropdown-item" href="#" onclick="handleExportToQuery('{{ id_prefix }}', '{{ input_id }}')">To Query (Max 500)</a></li>
        <li><a class="dropdown-item" href="#" onclick="handleExportToCSV('{{ id_prefix }}', '{{ input_id }}')">To CSV (All matches)</a></li>
        <li><a class="dropdown-item" href="#" onclick="handleExportToBibTeX('{{ id_prefix }}', '{{ input_id }}')">To BibTeX</a></li>
        <li><a class="dropdown-item" href="#" onclick="handleExportToBibTeXPlus('{{ id_prefix }}', '{{ input_id }}')">To BibTeX+</a></li>
    </ul>
</div>
