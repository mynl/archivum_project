<div hx-swap-oob="beforeend:#ingest-results">
    <div class="alert alert-{{ level|default('info') }} alert-dismissible fade show shadow-sm border-0 py-2 px-3 mb-2 small" role="alert">
        {% if html_message is defined and html_message %}{{ html_message|safe }}
        {% else %}{{ message }}{% endif %}
        <button type="button" class="btn-close btn-close-sm py-2" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>
