{% if counts %}
<div class="dense-list">
    {% for item in counts %}
    <div class="list-item">
        <span class="badge-container">
            <span class="line-number" style="display: inline-block; min-width: 2.8rem; text-align: center; vertical-align: middle; margin-right: 0.2rem;">{{ item.count }}</span>
            <span class="text-muted small ms-1" style="font-family: monospace; font-size: 0.7rem;">{{ item.hash[:8] }}</span>
        </span>
        <span class="content-wrapper">
            {% if item.tag %}
                <a href="{{ url_for('main.view', tag=item.tag) }}" class="tag text-decoration-none fw-bold me-2" target="_blank">{{ item.tag }}</a>
            {% else %}
                <span class="text-muted me-2">[No Tag]</span>
            {% endif %}
            <span class="title">"{{ item.title }}"</span>
            <span class="author text-muted small ms-2">{{ item.authors }}</span>
        </span>
    </div>
    {% endfor %}
</div>
<p class="muted" style="margin-top: 1rem; font-size: 0.8rem;">{{ counts|length }} documents matched.</p>
{% else %}
<p class="muted">No matches found.</p>
{% endif %}
