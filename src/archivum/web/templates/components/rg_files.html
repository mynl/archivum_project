{% if files %}
<div class="dense-list">
    {% for item in files %}
    <div class="list-item">
        <span class="badge-container">
            <span class="text-muted small fw-bold" style="font-family: monospace;">{{ item.hash[:12] }}</span>
        </span>
        <span class="content-wrapper">
            {% if item.tag %}
                <a href="{{ url_for('main.view', tag=item.tag) }}" class="tag text-decoration-none fw-bold me-2" target="_blank">{{ item.tag }}</a>
            {% else %}
                <span class="text-muted me-2">[No Tag]</span>
            {% endif %}
            <span class="title">"{{ item.title }}"</span>
        </span>
    </div>
    {% endfor %}
</div>
<p class="muted" style="margin-top: 1rem; font-size: 0.8rem;">{{ files|length }} files matching globs.</p>
{% else %}
<p class="muted">No files matched the glob patterns.</p>
{% endif %}
