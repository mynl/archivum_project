{% if matches %}
{% for tag in matches %}
<button type="button" 
        class="list-group-item list-group-item-action" 
        hx-get="{{ url_for('main.edit_tag', tag=tag) }}" 
        hx-target="#editor-container"
        onclick="document.getElementById('tag-suggestions').innerHTML = ''; document.getElementById('tag-search').value = '{{ tag }}';">
    {{ tag }}
</button>
{% endfor %}
{% endif %}
