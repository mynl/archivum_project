{% if matches %}
{% for tag in matches %}
<button type="button" 
        class="list-group-item list-group-item-action py-2" 
        onclick="document.getElementById('tag-search').value = '{{ tag }}'; document.getElementById('tag-suggestions').innerHTML = ''; document.getElementById('load-tag-btn').click();">
    {{ tag }}
</button>
{% endfor %}
{% endif %}
