{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-4 border-end">
        <h5 class="mb-3 text-muted small fw-bold text-uppercase">Select Reference</h5>
        <div class="position-relative mb-4">
            <input type="text" 
                   id="tag-search" 
                   name="q" 
                   value="{{ initial_tag }}"
                   placeholder="Type tag to edit..." 
                   class="form-control form-control-lg border-2"
                   hx-get="{{ url_for('main.tag_suggest') }}" 
                   hx-trigger="keyup changed delay:100ms" 
                   hx-target="#tag-suggestions"
                   autocomplete="off">
            <div id="tag-suggestions" class="list-group position-absolute w-100 shadow-sm z-3" style="margin-top: 2px;"></div>
        </div>
        <div id="edit-history" class="small text-muted">
            <p>Recent tags will appear here.</p>
        </div>
    </div>
    
    <div class="col-md-8 px-5">
        <div id="editor-container" 
             {% if initial_tag %} 
             hx-get="{{ url_for('main.edit_tag', tag=initial_tag) }}" 
             hx-trigger="load" 
             {% endif %}>
            <div class="text-center py-5">
                <p class="text-muted">Search for a tag on the left to start editing.</p>
            </div>
        </div>
    </div>
</div>

<script>
    document.body.addEventListener('click', function(evt) {
        if (!evt.target.closest('#tag-search') && !evt.target.closest('#tag-suggestions')) {
            document.getElementById('tag-suggestions').innerHTML = '';
        }
    });
</script>
{% endblock %}
