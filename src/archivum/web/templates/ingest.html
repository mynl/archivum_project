{% extends "base.html" %}

{% block content %}
<div id="ingest-container">
    <div id="ingest-workbench">
        {% include "_ingest_start.html" %}
    </div>
    <div id="ingest-results" class="mt-4"></div>
</div>

<script>
    // Page-level, attached once: the fragments swapped into #ingest-workbench
    // must not re-register this.
    document.body.addEventListener('htmx:responseError', function(evt) {
        const errorContainer = document.getElementById('ingest-error');
        const errorMessage = document.getElementById('error-message');
        if (errorContainer && errorMessage) {
            errorMessage.textContent = evt.detail.xhr.responseText || 'An unknown error occurred';
            errorContainer.classList.remove('d-none');
        }
    });
</script>

<style>
    .drop-zone { transition: all 0.2s ease-in-out; }
    .drop-zone:hover { background-color: #f8f9fa !important; border-color: #0d6efd !important; }
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline-block; }
    .htmx-request.btn { pointer-events: none; opacity: 0.8; }
</style>
{% endblock %}
