{% extends "base.html" %}

{% block content %}
<div class="search-container">
    <input type="text" 
           id="search-input" 
           name="q" 
           placeholder="Search (f fuzzy, q querex)..." 
           hx-get="{{ url_for('main.search') }}" 
           hx-trigger="keyup changed delay:250ms" 
           hx-target="#results" 
           hx-include="[name='view_mode']:checked"
           autofocus>
</div>

<div class="view-options">
    <span>View Mode:</span>
    <label>
        <input type="radio" name="view_mode" value="list" checked 
               hx-get="{{ url_for('main.search') }}" 
               hx-target="#results" 
               hx-include="#search-input"> Dense List
    </label>
    <label>
        <input type="radio" name="view_mode" value="table" 
               hx-get="{{ url_for('main.search') }}" 
               hx-target="#results" 
               hx-include="#search-input"> Table
    </label>
</div>

<div id="results">
    <!-- Results will be loaded here via HTMX -->
    <p class="muted">Start typing to search (prefix with 'q ' for Querex, 'f ' for Fuzzy)...</p>
</div>
{% endblock %}
