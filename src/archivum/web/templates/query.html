{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-3">
    <!-- Standardized Search Input -->
    <div class="search-container row g-2 mb-3">
        <div class="col">
            <div class="search-wrapper shadow-sm">
                <input type="text" 
                       id="search-input" 
                       name="q" 
                       placeholder="Search references (tag, f query, q query)..." 
                       hx-get="{{ url_for('main.search') }}" 
                       hx-trigger="keyup changed delay:250ms, search-trigger from:body" 
                       hx-target="#results" 
                       hx-include="[name='view_mode']:checked"
                       autocapitalize="none"
                       autocorrect="off"
                       spellcheck="false"
                       autofocus>
                <i class="bi bi-x-circle clear-input" onclick="clearInput('search-input')"></i>
            </div>
        </div>
    </div>

    <!-- Standardized Buttons Row -->
    <div class="d-flex flex-wrap align-items-center gap-2 mb-4">
        <!-- Main Actions -->
        <button class="btn btn-primary px-3 shadow-sm" 
                onclick="executeRecent()">
            Recent
        </button>

        {% if is_admin %}
        <button class="btn btn-outline-success px-3 shadow-sm"
                onclick="openReportStudio()">
            <i class="bi bi-journal-plus me-1"></i> Report
        </button>
        {% endif %}

        <!-- Placeholder for Export (Standardized across views) -->
        <div id="export-container" class="btn-group shadow-sm">
             <button class="btn btn-outline-info px-4 opacity-50" disabled>Export</button>
        </div>

        <!-- Options Dropdown -->
        <div class="dropdown">
            <button class="btn btn-outline-secondary px-3 shadow-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
                <i class="bi bi-gear-fill me-1"></i> Options
            </button>
            <ul class="dropdown-menu shadow-sm p-3" style="min-width: 200px;">
                <li><h6 class="dropdown-header px-0 text-uppercase small pb-2 border-bottom mb-2">View Mode</h6></li>
                <li>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="view_mode" id="view_list" value="list" checked 
                               hx-get="{{ url_for('main.search') }}" hx-target="#results" hx-include="#search-input">
                        <label class="form-check-label small" for="view_list">Dense List</label>
                    </div>
                </li>
                <li>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="view_mode" id="view_verbose" value="verbose"
                               hx-get="{{ url_for('main.search') }}" hx-target="#results" hx-include="#search-input">
                        <label class="form-check-label small" for="view_verbose">Verbose</label>
                    </div>
                </li>
                <li>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="view_mode" id="view_table" value="table" 
                               hx-get="{{ url_for('main.search') }}" hx-target="#results" hx-include="#search-input">
                        <label class="form-check-label small" for="view_table">Table</label>
                    </div>
                </li>
            </ul>
        </div>

        <div id="export-indicator" class="htmx-indicator d-flex align-items-center gap-1 text-success small ms-2">
            <div class="spinner-border spinner-border-sm" role="status"></div>
        </div>
    </div>
</div>

<script>
    function openReportStudio() {
        const queryInput = document.getElementById('search-input');
        const query = queryInput ? queryInput.value.trim() : '';
        window.location.href = `{{ url_for('main.reports_page') }}?q=${encodeURIComponent(query)}`;
    }

    function clearInput(id) {
        const input = document.getElementById(id);
        if (input) {
            input.value = '';
            input.focus();
            htmx.trigger(input, 'keyup');
        }
    }

    function executeRecent() {
        const input = document.getElementById('search-input');
        if (input) {
            input.value = 'q top 20 recent';
            htmx.trigger(input, 'keyup');
        }
    }

    // Deep-linking support
    window.addEventListener('load', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q');
        if (query) {
            const input = document.getElementById('search-input');
            if (input) {
                input.value = query;
                // Small delay to ensure HTMX is ready
                setTimeout(() => htmx.trigger(input, 'keyup'), 100);
            }
        }
    });
</script>

<div id="results" class="mt-4 shadow-sm rounded bg-white overflow-hidden">
    <!-- Results will be loaded here via HTMX -->
    <div class="p-4">
        <p class="text-muted">Start typing to search (optional prefix 'f' or 'q')...</p>
    </div>
</div>

{% include "components/edit_modal.html" %}
{% endblock %}
