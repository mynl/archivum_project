{% extends "base.html" %}

{% block content %}
<script>
    function clearResults() {
        document.getElementById('rg-results').innerHTML = '';
        document.getElementById('rg-status').style.display = 'none';
    }
</script>

<div class="search-container row g-2">
    <div class="col">
        <div class="search-wrapper">
            <input type="text" 
                   id="rg-input" 
                   name="q" 
                   placeholder="Full-text search (ripgrep)..." 
                   hx-get="{{ url_for('main.rg_search') }}" 
                   hx-trigger="keyup[key=='Enter']" 
                   hx-target="#rg-stream-sink" 
                   hx-swap="innerHTML"
                   hx-include="#rg-controls input"
                   hx-indicator="#rg-indicator"
                   hx-on:click="clearResults()"
                   autofocus>
            <i class="bi bi-x-circle clear-input" onclick="clearInput('rg-input')"></i>
        </div>
    </div>
    <div class="col-auto">
        <button hx-get="{{ url_for('main.rg_search') }}" 
                hx-target="#rg-stream-sink" 
                hx-swap="innerHTML"
                hx-include="#rg-input, #rg-controls input"
                hx-indicator="#rg-indicator"
                hx-on:click="clearResults()"
                class="btn btn-primary btn-lg px-4"
                style="height: 100%;">
            Execute
        </button>
    </div>
</div>

<div id="rg-controls" class="view-options">
    <div class="d-flex flex-wrap align-items-center gap-3">
        <!-- Modes -->
        <div class="d-flex gap-2 pe-3 border-end">
            <button hx-get="{{ url_for('main.rg_search') }}" hx-vals='{"counts": "true"}' 
                    hx-target="#rg-stream-sink" hx-include="#rg-input, #rg-controls input" hx-indicator="#rg-indicator"
                    hx-on:click="clearResults()" class="btn btn-outline-secondary btn-sm">Counts</button>
        </div>

        <!-- Filter -->
        <div class="pe-3 border-end">
            <div class="btn-group" role="group">
                <input type="radio" class="btn-check" name="filter" id="filter_tagged" value="tagged" checked>
                <label class="btn btn-outline-secondary btn-sm" for="filter_tagged">Tagged</label>
                <input type="radio" class="btn-check" name="filter" id="filter_all" value="all">
                <label class="btn btn-outline-secondary btn-sm" for="filter_all">All</label>
            </div>
        </div>

        <!-- Context -->
        <div class="pe-3 border-end d-flex align-items-center gap-2">
            <div class="input-group input-group-sm" style="width: 130px;">
                <span class="input-group-text bg-transparent border-0 px-1 small">B:</span>
                <input type="number" name="before" value="0" min="0" max="10" class="form-control rounded-1">
                <span class="input-group-text bg-transparent border-0 px-1 small">A:</span>
                <input type="number" name="after" value="0" min="0" max="10" class="form-control rounded-1">
            </div>
        </div>

        <!-- Case -->
        <div class="pe-3 border-end">
            <div class="btn-group btn-group-sm">
                <input type="radio" class="btn-check" name="case" id="case_ignore" value="ignore" checked>
                <label class="btn btn-outline-secondary" for="case_ignore">Ignore Case</label>
                <input type="radio" class="btn-check" name="case" id="case_sensitive" value="sensitive">
                <label class="btn btn-outline-secondary" for="case_sensitive">Sensitive</label>
            </div>
        </div>

        <!-- Globs & Files (Right Aligned Group) -->
        <div class="d-flex align-items-center gap-2 ms-auto">
            <span class="small fw-bold text-muted d-none d-md-inline">GLOBS:</span>
            <input type="text" name="glob1" placeholder="*.md" class="form-control form-control-sm" style="width: 100px;">
            <input type="text" name="glob2" placeholder="Pattern" class="form-control form-control-sm" style="width: 100px;">
            <button hx-get="{{ url_for('main.rg_search') }}" hx-vals='{"files": "true"}' 
                    hx-target="#rg-stream-sink" hx-include="#rg-input, #rg-controls input" hx-indicator="#rg-indicator"
                    hx-on:click="clearResults()" class="btn btn-outline-secondary btn-sm">Files</button>
        </div>
    </div>
</div>

<div id="rg-status" class="alert alert-secondary py-2 px-3 mb-3 border-0 shadow-sm" style="display: none; font-size: 0.85rem;">
    <!-- Last command will be displayed here -->
</div>

<div id="rg-indicator" class="htmx-indicator mb-3">
    <div class="d-flex align-items-center gap-2 text-primary">
        <div class="spinner-border spinner-border-sm" role="status"></div>
        <span>Running ripgrep search...</span>
    </div>
</div>

<div id="rg-stream-sink" style="display: none;"></div>

<div id="rg-results">
    <p class="text-muted">Press Enter or click Execute to search document text...</p>
</div>
{% endblock %}
