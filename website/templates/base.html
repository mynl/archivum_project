<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="https://unpkg.com/htmx.org@1.9.5"></script>

  <!-- Tabulator -->
  <link href="https://unpkg.com/tabulator-tables@6.2.0/dist/css/tabulator.min.css" rel="stylesheet">
  <script src="https://unpkg.com/tabulator-tables@6.2.0/dist/js/tabulator.min.js"></script>

  <!-- Fuse.js -->
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>

  <link rel="icon" href="{{ url_for('static', filename='favicon/favicon.ico') }}" type="image/x-icon">
  <title>{% block title %}My Site{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="bg-light py-3 mb-4 border-bottom">
    <div class="meta-layout d-flex justify-content-between align-items-center">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" height="50">
      <h1 class="h4 m-0">{% block page_heading %}{% endblock %}</h1>
    </div>
    <nav class="container">
      <a href="{{ url_for('home.home') }}" class="me-3 {% if active_page == 'home' %}active{% endif %}">Home</a>
      <a href="{{ url_for('new_doc.new') }}" class="me-3 {% if active_page == 'new' %}active{% endif %}">New</a>
      <a href="{{ url_for('querex.querex') }}" class="me-3 {% if active_page == 'querex' %}active{% endif %}">Querex</a>
      <a href="{{ url_for('grid.grid') }}" class="me-3 {% if active_page == 'grid' %}active{% endif %}">Grid</a>
      <a href="{{ url_for('generic.home') }}" class="me-3 {% if active_page == 'generic' %}active{% endif %}">Generic (->)</a>
    </nav>
  </header>

  <main class="container">
    {% block breadcrumbs %}{% endblock %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
