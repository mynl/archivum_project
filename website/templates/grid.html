{% extends "base.html" %}

{% block title %}Document Grid JS component{% endblock %}

{% block content %}

  <h2>Document Grid</h2>
  <input id="grid-search" type="text" placeholder="Fuzzy search..." />

  <div id="grid-table"></div>

  <script>
    let gridTable, fuse, allData = [], columns = [];

    fetch("/grid-data")
      .then(r => r.json())
      .then(({data, columns: cols}) => {
        allData = data;
        columns = cols;

        // Init Tabulator
        gridTable = new Tabulator("#grid-table", {
          height: "80vh",
          layout: "fitColumns",
          data: allData,
          columns: columns,
          pagination: "local",
          paginationSize: 50,
        });

        // Init Fuse
        fuse = new Fuse(allData, {
          keys: ["search_blob"],
          includeScore: true,
          threshold: 0.2,
          minMatchCharLength: 2,
          ignoreLocation: true,
        });
      });

    document.getElementById("grid-search").addEventListener("input", function () {
      const query = this.value.trim();
      if (!query || !fuse) {
        gridTable.setData(allData);
        return;
      }

      const terms = query.toLowerCase().split(/\s+/);
      const matchingSets = terms.map(term =>
        new Set(fuse.search(term).map(r => r.item.id))
      );

      // INTERSECTION of all match sets (must match every word)
      const matchingIDs = [...matchingSets.reduce((a, b) => {
        return new Set([...a].filter(x => b.has(x)));
      })];

      const results = allData.filter(row => matchingIDs.includes(row.id));

      // console.log("Query:", query);
      // console.log("Matched IDs:", matchingIDs);
      gridTable.setData(results);
    });
  </script>


{% endblock %}
